# Ctrl-Space as Prefix cmd
unbind C-Space
setw -g prefix C-Space
bind C-Space send-prefix

# Refresh config
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded config"

# Mouse friendly
set -g mouse on

# Increase history
set-option -g history-limit 5000

# Switch from zero-based to one-based window/pane numbering
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is removed
set -g renumber-windows on

# Split commands
bind-key "|" split-window -h -c "#{pane_current_path}"
bind-key "\\" split-window -fh -c "#{pane_current_path}"

bind-key "-" split-window -v -c "#{pane_current_path}"
bind-key "_" split-window -fv -c "#{pane_current_path}"

# Switch panes
# setw -g mode-keys vi
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# bind-key -T copy-mode-vi set-key -C copy-pipe-and-cancel "xclip -selection clipboard -i"
# bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
# bind-key h select-pane -L
# bind-key j select-pane -D
# bind-key k select-pane -U
# bind-key l select-pane -R

# Swap windows around
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# Keep current path when splitting
bind c new-window -c "#{pane_current_path}"

# Resizing
bind -r C-j resize-pane -D 15
bind -r C-k resize-pane -U 15
bind -r C-h resize-pane -L 15
bind -r C-l resize-pane -R 15

# Copy/paste
set -s set-clipboard external
# set -s copy-command 'xsel -i -b'

# Quickly access notes
bind-key h split-window -h "vim ~/scratch/notes.md"

# Install packages
# bind-key -T prefix I run-shell ~/.tmux/plugins/tpm/bindings/install_plugins
# set -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"


# Escape time for Evil Emacs.
set -sg escape-time 0

# Allow modifiers in various TUIs
set -g extended-keys on


################### Plugin Manager ###################
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'alexwforsythe/tmux-which-key'

# Restore sessions.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

## Theme
set -g @plugin 'egel/tmux-gruvbox'
# set desired theme options...
set -g @tmux-gruvbox 'dark' # or 'dark256', 'light', 'light256'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'



################### Plugin Config ###################

# Tmux Menus
set -g @menus_trigger 'm'





# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run-shell '~/.tmux/plugins/tpm/tpm'

